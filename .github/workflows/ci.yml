name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crm_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crm_test
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      # The runner image ships PostgreSQL 16; using it avoids pulling a database
      # image, which has failed on GitHub's shared runners both from Docker Hub
      # (anonymous rate limit) and from the AWS public mirror.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres';" -c "CREATE DATABASE crm_test;"
          pg_isready -h localhost -p 5432
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
